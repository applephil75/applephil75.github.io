---
layout: default
---

<article class="post">

  <header class="post-header">

    <div class="post-meta">
      {{ page.date | date: "%d.%m.%Y" }}
    </div>

    <h1>
      {{ page.title }}
    </h1>

    {% if page.description %}
      <p class="post-description">
        {{ page.description }}
      </p>
    {% endif %}

  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">

    <a href="{{ '/' | relative_url }}">
      ← back to home
    </a>

  </footer>

</article>
