<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} — {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description"
        content="{{ page.description | default: site.description }}">

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">

  {% feed_meta %}
</head>

<body>

  <div class="site">

    {% include header.html %}

    <main class="content">
      {{ content }}
    </main>

    {% include footer.html %}

  </div>

</body>
</html>
