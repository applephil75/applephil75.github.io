
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">

    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">
        {{ site.title }}
      </a>
      <p class="site-description">{{ site.description }}</p>
      <div class="terminal-line">
        <span>ONLINE JOURNAL</span>
        <span>EST. 2026</span>
      </div>
    </header>

    <main class="site-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>Fine della trasmissione.</p>
      <p>Pubblicato con Jekyll e GitHub Pages.</p>
    </footer>

  </div>
</body>
</html>
